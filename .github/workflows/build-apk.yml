name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ExchangeCalc-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # 휴대폰에서 바로 받을 수 있게 릴리스에 APK를 올린다 (항상 같은 주소)
      # https://github.com/<저장소>/releases/latest/download/ExchangeCalc.apk
      - name: Publish APK to release
        run: cp app/build/outputs/apk/debug/app-debug.apk ExchangeCalc.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: 환율계산기 최신 APK
          body: |
            휴대폰에서 아래 ExchangeCalc.apk 를 눌러 받은 뒤 설치하세요.
            빌드 커밋: ${{ github.sha }}
          files: ExchangeCalc.apk
          make_latest: true

      # 앱이 쓰는 외부 API가 살아있는지 확인 (실패해도 APK 빌드는 성공 처리)
      - name: Check data APIs
        continue-on-error: true
        run: |
          for tag in latest 2025-12-31; do
            curl -fsS "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@$tag/v1/currencies/usd.min.json" \
              | jq -c '{date, usd: (.usd | {krw, jpy, vnd, eur, idr, inr, cny, aud, thb})}'
          done
          curl -fsS https://api.country.is/ | jq -c '{country}'
